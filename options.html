<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>NotiRx — Options</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 560px;
      margin: 40px auto;
      padding: 0 20px 40px;
      color: #1a1a1a;
      line-height: 1.45;
    }
    h1 { font-size: 22px; color: #1a237e; margin-bottom: 8px; }
    p { font-size: 14px; color: #444; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #c5cae9;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      margin-top: 18px;
      background: #1a237e;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled,
    input:disabled { opacity: .65; cursor: default; }
    #status { min-height: 1.4em; font-size: 14px; margin-top: 14px; }
    #status.ok { color: #2e7d32; }
    #status.bad { color: #c62828; }
    #host-warning {
      background: #fff3e0;
      border: 1px solid #ffe0b2;
      color: #e65100;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
    }
    code { font-size: 12px; }
  </style>
</head>
<body>
  <h1>NotiRx — configuration</h1>
  <p id="intro">
    Entrez l’adresse du service NotiRx et la clé API de cette pharmacie.
    Les deux restent dans ce navigateur. Elles ne sont pas écrites dans les fichiers de l’extension.
  </p>
  <p id="host-warning" hidden></p>

  <form id="config-form">
    <label for="api-base-url">Adresse API (https)</label>
    <input
      id="api-base-url"
      name="api-base-url"
      type="url"
      inputmode="url"
      autocomplete="off"
      spellcheck="false"
      placeholder="https://xxxx.execute-api.ca-central-1.amazonaws.com/prod"
      required
    />

    <label for="api-key">Clé API</label>
    <input
      id="api-key"
      name="api-key"
      type="password"
      autocomplete="off"
      spellcheck="false"
      required
    />

    <button type="submit">Enregistrer</button>
  </form>
  <p id="status" role="status"></p>

  <script type="module" src="options.js"></script>
</body>
</html>
