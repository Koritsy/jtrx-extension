<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>NotiRx — Test</title>
  <style>
    body { font-family: system-ui; max-width: 400px; margin: 60px auto; padding: 0 20px; }
    h2 { font-size: 16px; margin-bottom: 20px; color: #1a237e; }
    p  { font-size: 13px; color: #555; margin-bottom: 20px; line-height: 1.5; }

    .card { background: #f5f7ff; border: 1px solid #c5cae9; border-radius: 10px;
            padding: 14px 16px; margin-bottom: 20px; min-height: 70px; }
    .card-name { font-size: 16px; font-weight: 700; color: #1a237e; }
    .card-info { font-size: 13px; color: #555; margin-top: 4px; }

    button { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px;
             font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
    .load  { background: #1a237e; color: white; }
    .clear { background: #ffebee; color: #c62828; }

    /* Hidden Priorx DOM — content.js reads these */
    #priorx { display: none; }
  </style>
</head>
<body>

  <h2>NotiRx — Page de test</h2>
  <p>
    Clique <strong>Charger patient</strong>, puis ouvre le panneau latéral
    en cliquant sur l'icône NotiRx dans la barre d'outils de ton navigateur.
  </p>

  <!-- Visible preview -->
  <div class="card">
    <div class="card-name" id="preview-name">Aucun patient chargé</div>
    <div class="card-info" id="preview-info"></div>
  </div>

  <button class="load"  onclick="load()">Charger patient (toi)</button>
  <button class="clear" onclick="clear()">✕ Effacer le patient</button>

  <!-- Hidden Priorx DOM read by content.js -->
  <div id="priorx">
    <div id="BA01_LastName"></div>
    <div id="BA01_FirstName"></div>
    <div id="BA01_Info2"></div>
    <div id="LoginName1">jositr</div>
  </div>

  <script>
    function setText(id, value) {
      const el = document.getElementById(id);
      while (el.firstChild) el.removeChild(el.firstChild);
      if (value) el.appendChild(document.createTextNode(value));
    }

    function load() {
      setText('BA01_FirstName', ', Josianne');
      setText('BA01_Info2', '438.524.6123 - 168 rue Louise-Bernard, Beloeil');
      // Fire lastName last — content.js watches this one
      setTimeout(() => {
        setText('BA01_LastName', 'Tremblay');
        document.getElementById('preview-name').textContent = 'TREMBLAY, Josianne';
        document.getElementById('preview-info').textContent = '438.524.6123 — 168 rue Louise-Bernard, Beloeil';
      }, 50);
    }

    function clear() {
      ['BA01_LastName','BA01_FirstName','BA01_Info2'].forEach(id => setText(id, ''));
      document.getElementById('preview-name').textContent = 'Aucun patient chargé';
      document.getElementById('preview-info').textContent = '';
    }
  </script>
</body>
</html>
